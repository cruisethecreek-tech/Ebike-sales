name: Sync Bike Inventory

# Triggers:
#   1. repository_dispatch — called by Apps Script when Pat edits the Sheet.
#      Event type: "sync-inventory"
#   2. Daily schedule — safety net so stale data is caught within 24 hours.
#   3. Manual trigger — for testing / forcing a refresh.
on:
  repository_dispatch:
    types: [sync-inventory]
  schedule:
    - cron: "0 6 * * *"   # 6 AM UTC daily
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit data/inventory.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Fetch inventory from Apps Script
        run: |
          set -o pipefail
          INV_URL="https://script.google.com/macros/s/AKfycbyxVMuFEUeR8_YqM1VVnfPSVPnDhdCs_63dDthZ4jODlTDGQ-7yXSkQeYT-Ux0SM8tw/exec"
          CODE=$(curl -sL -w '%{http_code}' "$INV_URL?action=getBikeInventory" -o /tmp/bikes_raw.json)
          echo "HTTP $CODE, $(wc -c < /tmp/bikes_raw.json) bytes"

          # Apps Script answers 200 with an HTML error page when the script
          # throws, so the status alone proves nothing. Show what came back
          # before trying to parse it — the previous version died on a Python
          # traceback that named the json module and not the actual problem.
          if ! head -c 1 /tmp/bikes_raw.json | grep -q '\['; then
            echo "::error::Apps Script did not return a JSON array."
            echo "First 400 characters of the response:"
            head -c 400 /tmp/bikes_raw.json
            echo
            echo "Open the /exec URL in a browser — Apps Script shows the real"
            echo "error there. Usually the script threw, or the deployment is"
            echo "serving a version that no longer runs."
            exit 1
          fi
          echo "Fetched $(python3 -c 'import json; print(len(json.load(open("/tmp/bikes_raw.json"))))') bikes"

      - name: Wrap in envelope and write to data/inventory.json
        run: |
          python3 - <<'PYEOF'
          import json, datetime, os

          with open('/tmp/bikes_raw.json') as f:
              bikes = json.load(f)

          # Never let a bad fetch empty the shop. Every page on the site reads
          # this file, so publishing [] takes the whole catalogue down and the
          # commit looks exactly like a normal sync.
          if not isinstance(bikes, list):
              raise SystemExit('Endpoint returned %s, not a list.' % type(bikes).__name__)
          if len(bikes) < 10:
              raise SystemExit(
                  'Only %d bike(s) came back. Refusing to publish — that would '
                  'empty the site. Check the sheet and the Apps Script '
                  'deployment, then re-run.' % len(bikes))

          before = 0
          if os.path.exists('data/inventory.json'):
              try:
                  with open('data/inventory.json') as f:
                      before = len(json.load(f).get('bikes', []))
              except Exception:
                  before = 0
          if before and len(bikes) < before * 0.5:
              raise SystemExit(
                  'Bike count fell from %d to %d, more than half. Refusing to '
                  'publish in case the endpoint is broken. If the drop is real '
                  '(a big cleanup), re-run this workflow and it will pass once '
                  'the published file is closer to the new number.'
                  % (before, len(bikes)))

          payload = {
              "lastUpdated": datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
              "bikes": bikes
          }

          os.makedirs('data', exist_ok=True)
          with open('data/inventory.json', 'w') as f:
              json.dump(payload, f, indent=2)

          print(f"Wrote {len(bikes)} bikes to data/inventory.json")
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/inventory.json
          if git diff --staged --quiet; then
            echo "No inventory changes — nothing to commit."
          else
            BIKE_COUNT=$(python3 -c "import json; d=json.load(open('data/inventory.json')); print(len(d['bikes']))")
            git commit -m "chore: sync inventory — $BIKE_COUNT bikes [skip ci]"
            git push
            echo "Pushed updated inventory.json"
          fi
