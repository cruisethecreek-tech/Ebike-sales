<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Short link for the outdoor walking-pole stand QR code:
     cruisethecreek.com/poles -> Jetti Walking Poles Peek booking.
     To repoint the QR later, just change the URL in all THREE places below
     (meta refresh, canonical, and the script) and redeploy. The printed QR
     never changes. -->
<meta http-equiv="refresh" content="0; url=https://book.peek.com/s/57e3b62e-4f48-4cc4-8876-7b79f4c11baa/rlAkb">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://book.peek.com/s/57e3b62e-4f48-4cc4-8876-7b79f4c11baa/rlAkb">
<title>Booking Jetti Walking Poles — Cruise the Creek</title>
<style>
  html,body{height:100%}
  body{margin:0;font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    background:#2D4A32;color:#F5F0E8;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;line-height:1.6}
  .box{max-width:420px}
  .spin{width:34px;height:34px;margin:0 auto 18px;border:3px solid rgba(245,240,232,.25);
    border-top-color:#C9A96E;border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  h1{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.03em;margin:0 0 8px}
  a{color:#C9A96E;font-weight:700}
</style>
<script>
  // Fastest path: replace() so the redirect page never lands in history
  // (back button returns to the camera/QR scan, not this page).
  window.location.replace("https://book.peek.com/s/57e3b62e-4f48-4cc4-8876-7b79f4c11baa/rlAkb");
</script>
</head>
<body>
  <div class="box">
    <div class="spin" aria-hidden="true"></div>
    <h1>Cruise the Creek</h1>
    <p>Taking you to Jetti walking pole booking…</p>
    <p>If nothing happens, <a href="https://book.peek.com/s/57e3b62e-4f48-4cc4-8876-7b79f4c11baa/rlAkb">tap here to book</a>.</p>
  </div>
</body>
</html>
